<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Montoya</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="overlay">
    <div id="topbar">
      <div class="topbar-left">
        <div class="logo-badge">M</div>
        <span id="title">MONTOYA</span>
      </div>
      <div class="topbar-right">
        <span id="userBadge"></span>
        <button id="closeBtn">Fermer ✕</button>
      </div>
    </div>
    <div id="app">
      <div id="bootScreen" style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#808080">
        <div style="width:34px;height:34px;border:3px solid rgba(255,255,255,0.15);border-top-color:#ff473a;border-radius:50%;animation:spin 0.8s linear infinite"></div>
        <div style="font-size:13px">Chargement du panel...</div>
      </div>
    </div>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  <script>
    // Si app.js ne se charge pas dans les 5s, afficher une erreur
    window.addEventListener('error', function(e){
      var b = document.getElementById('bootScreen');
      if (b) b.innerHTML = '<div style="color:#ff7a6a;font-family:monospace;font-size:12px;padding:20px">Erreur JS: ' + (e.message||'inconnue') + '</div>';
    });
    setTimeout(function(){
      var b = document.getElementById('bootScreen');
      if (b && b.querySelector('div[style*="spin"]')) {
        b.innerHTML = '<div style="color:#ff7a6a;font-family:monospace;font-size:12px;padding:20px">app.js non chargé — vérifiez que les fichiers html/ sont bien déployés sur le serveur FiveM.</div>';
      }
    }, 5000);
  </script>
  <script src="app.js"></script>
</body>
</html>
